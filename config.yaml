# Сигнал
signal:
  sampling_rate: 100        # Гц (версия PTB-XL low-resolution)
  duration_sec: 10          # длительность записи
  num_leads: 12             # количество отведений
  lead_names: [I, II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6]
  bandpass: [0.5, 47.0]     # Гц, полосовой фильтр (убирает шум)
  normalize: zscore         # метод нормализации

# Модель
model:
  num_classes: 5
  class_names: [NORM, MI, STTC, CD, HYP]
  class_labels_ru:
    NORM: Норма
    MI: Инфаркт миокарда
    STTC: Изменения сегмента ST и зубца T
    CD: Нарушения проводимости
    HYP: Гипертрофия
  dropout: 0.3

# Обучение
training:
  seed: 42                  # для воспроизводимости результатов
  batch_size: 64
  epochs: 40
  learning_rate: 0.001
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]

# Анализ
predict:
  threshold: 0.5            # порог для решения «диагноз есть/нет»
  model_path: models/ecg_model.pth